[workspace]
members = [
  "crates/sls2-combat-core",
  "crates/sls2-combat-python",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
blake3 = "1.8"
pyo3 = { version = "0.27", features = ["abi3-py310", "extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
