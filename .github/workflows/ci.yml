name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  governance:
    name: Specifications and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Validate specifications and traceability
        run: python3 tools/specs/check.py

      - name: Verify generated public contracts
        run: python3 tools/specs/generate_contracts.py --check

      - name: Verify deterministic offline data package
        run: python3 tools/spire-codex/verify.py

      - name: Verify implemented and published content ledgers
        run: python3 tools/specs/generate_content_status.py --check

      - name: Enforce crate dependency boundaries
        run: python3 tools/specs/check_architecture.py

  rust-tests:
    name: Rust quality and tests
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache Cargo files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint native targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint WebAssembly target
        run: cargo clippy --target wasm32-unknown-unknown -p rusty-spire-wasm --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features --locked --no-fail-fast

  python-tests:
    name: Python catalog tests
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run catalog tooling tests
        run: |
          python -m unittest discover -s tools/spire-codex/tests -v
          python -m unittest discover -s tools/specs/tests -v

  web-tests:
    name: Web and WASM tests
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Cargo files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web and WASM tests
        working-directory: apps/web
        run: npm test

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [governance, rust-tests, python-tests, web-tests, coverage, build]
    env:
      GOVERNANCE_RESULT: ${{ needs.governance.result }}
      RUST_RESULT: ${{ needs.rust-tests.result }}
      PYTHON_RESULT: ${{ needs.python-tests.result }}
      WEB_RESULT: ${{ needs.web-tests.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Require every gated job to succeed
        run: |
          printf 'Governance: %s\nRust: %s\nPython: %s\nWeb/WASM: %s\nCoverage: %s\nBuild: %s\n' \
            "$GOVERNANCE_RESULT" "$RUST_RESULT" "$PYTHON_RESULT" "$WEB_RESULT" \
            "$COVERAGE_RESULT" "$BUILD_RESULT"
          test "$GOVERNANCE_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$BUILD_RESULT" = success

  coverage:
    name: Coverage
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust coverage toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --component llvm-tools-preview
          rustup default "$RUST_VERSION"

      - name: Cache Cargo coverage files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-${{ env.CARGO_LLVM_COV_VERSION }}-

      - name: Install cargo-llvm-cov
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -Fq "cargo-llvm-cov $CARGO_LLVM_COV_VERSION"; then
            cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked
          fi

      - name: Collect Rust coverage
        run: >-
          cargo llvm-cov
          --package rusty-spire-core
          --package rusty-spire-data
          --package rusty-spire-combat
          --package rusty-spire-simulator
          --package rusty-spire-heuristics
          --package rusty-spire-api
          --package rusty-spire-cli
          --all-features
          --locked
          --no-report

      - name: Enforce and summarize Rust coverage
        run: |
          summary="$RUNNER_TEMP/coverage-summary.txt"
          set +e
          cargo llvm-cov report --summary-only --fail-under-lines 85 >"$summary" 2>&1
          status=$?
          set -e

          cat "$summary"
          {
            echo '## Rust coverage'
            echo
            echo 'Required line coverage: **85%**'
            echo
            echo '```text'
            cat "$summary"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

          exit "$status"

  build:
    name: Build
    needs: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Cargo files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-${{ env.RUST_VERSION }}-

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Smoke-test release CLI
        run: target/release/rusty-spire --version

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Verify committed WASM source fingerprint
        working-directory: apps/web
        run: npm run check:wasm-fingerprint

      - name: Smoke-test committed WASM
        working-directory: apps/web
        env:
          RUSTY_SPIRE_WASM_PATH: public/rusty_spire_wasm.wasm
        run: node --test tests/wasm-solver.test.mjs

      - name: Build production website
        working-directory: apps/web
        run: npm run build

      - name: Verify production outputs
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/rusty_spire_wasm.wasm
          find apps/web/dist/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find apps/web/dist/assets -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .

      - name: Verify generated fingerprint is current
        run: git diff --exit-code -- apps/web/public/rusty_spire_wasm.sources.sha256
