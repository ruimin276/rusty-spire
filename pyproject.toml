[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sls2-combat-solver"
version = "0.1.0"
description = "Accurate single-combat Slay the Spire 2 card comparison through a game-backed oracle."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sls2-combat-solver contributors"}]

[project.scripts]
sls2-combat = "sls2_combat_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
