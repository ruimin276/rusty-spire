[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "sls2-combat-solver"
version = "0.1.0"
description = "Accurate single-combat Slay the Spire 2 card comparison through a game-backed oracle."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sls2-combat-solver contributors"}]

[project.scripts]
sls2-combat = "sls2_combat_solver.cli:main"

[tool.maturin]
manifest-path = "crates/sls2-combat-python/Cargo.toml"
module-name = "sls2_combat_solver._native"
python-source = "src"
